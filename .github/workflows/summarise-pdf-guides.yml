name: Summarise PDF Guides

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-summarise all PDFs even if a summary already exists"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  summarise:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run summariser
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scrapers/summarise_docs.py --force
          else
            python scrapers/summarise_docs.py
          fi

      - name: Commit updated kb.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kb.json
          if git diff --cached --quiet; then
            echo "No summaries updated."
          else
            git commit -m "Add AI summaries for PDF step-by-step guides [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
