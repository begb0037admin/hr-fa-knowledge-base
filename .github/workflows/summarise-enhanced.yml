name: Summarise Enhanced (Two-Level)

# Generates ss (short) and sl (long) summary fields for knowledge base documents.
# The existing `s` field is never modified.
# Always run with dry_run=true first to review sample output before writing.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Document source to process"
        required: true
        type: choice
        options:
          - "Change Management"
          - "How To Guides"
          - "Access Group Help Centre"
          - "Kevin's Guides"
      type:
        description: "Restrict to document type within source (blank = all types)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "pdf"
          - "web"
      limit:
        description: "Max documents to process (0 = all in source)"
        required: false
        default: "5"
        type: string
      dry_run:
        description: "Dry run — print summaries without writing to kb.json"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force:
        description: "Re-generate even if ss/sl already exist"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  summarise:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run enhanced summariser
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOURCE: ${{ github.event.inputs.source }}
          DOC_TYPE: ${{ github.event.inputs.type }}
          LIMIT: ${{ github.event.inputs.limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=(--source "$SOURCE")
          [ -n "$DOC_TYPE" ] && ARGS+=(--type "$DOC_TYPE")
          [ "$LIMIT" != "0" ] && ARGS+=(--limit "$LIMIT")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          python scrapers/summarise_enhanced.py "${ARGS[@]}"

      - name: Commit updated kb.json
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kb.json
          if git diff --cached --quiet; then
            echo "No documents updated — nothing to commit."
          else
            git commit -m "Add enhanced ss/sl summaries for ${{ github.event.inputs.source }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
