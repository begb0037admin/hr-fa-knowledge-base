<title>HR Knowledge Base</title>
<style>:root{color-scheme:light;--bg:#fafaf7;--surface:#fff;--surface-2:#f1efe8;--text:#2c2c2a;--muted:#5f5e5a;--hint:#888780;--border:#d3d1c7;--border-soft:#e3e1d8;--accent:#185fa5;--accent-soft:#e6f1fb;--accent-text:#0c447c;--warn-soft:#faeeda;--warn-text:#633806;--pink-soft:#fbeaf0;--pink-text:#72243e;--teal-soft:#e1f5ee;--teal-text:#085041;--purple-soft:#eeedfe;--purple-text:#3c3489;--radius:8px;--radius-lg:12px}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;margin:0;padding:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}.container{max-width:1100px;margin:0 auto;padding:20px 18px 40px}.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:0.5px solid var(--border);margin-bottom:14px}.head h1{margin:0;font-size:20px;font-weight:500}.head .sub{color:var(--muted);font-size:13px;margin-top:3px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric{background:var(--surface-2);border-radius:var(--radius);padding:10px 12px}.metric .lbl{font-size:12px;color:var(--muted)}.metric .val{font-size:20px;font-weight:500;margin-top:2px}.controls{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:10px}.field{display:flex;flex-direction:column;gap:3px}label{font-size:12px;color:var(--muted)}input[type=text],select{height:34px;padding:0 10px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:inherit;font-size:14px}input[type=text]:focus,select:focus{outline:none;box-shadow:0 0 0 2px var(--accent-soft);border-color:var(--accent)}.toggles{display:flex;gap:14px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}.toggles label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.card{background:var(--surface);border:0.5px solid var(--border-soft);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px}.card h3{margin:0 0 4px;font-size:15px;font-weight:500}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.badge{font-size:11px;padding:1px 8px;border-radius:999px;line-height:1.5}.b-htg{background:var(--accent-soft);color:var(--accent-text)}.b-cm{background:var(--purple-soft);color:var(--purple-text)}.b-tp{background:var(--surface-2);color:var(--muted)}.b-sy{background:var(--teal-soft);color:var(--teal-text)}.b-ext{background:var(--warn-soft);color:var(--warn-text)}.b-arc{background:var(--pink-soft);color:var(--pink-text)}.summary{margin:4px 0}.path-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap}.path{font-family:ui-monospace,SF Mono,Menlo,Consolas,monospace;word-break:break-all}button.mini{font-size:12px;padding:3px 9px;border:0.5px solid var(--border);background:var(--surface);border-radius:var(--radius);cursor:pointer;color:var(--text);font-family:inherit}button.mini:hover{background:var(--surface-2)}.meta{font-size:11px;color:var(--hint);margin-top:6px}.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border-radius:var(--radius-lg);border:0.5px dashed var(--border)}mark{background:#fff7c2;color:var(--text);padding:0 1px}@media (max-width:720px){.metrics{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}}
/* == Upload modal & action buttons == */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:620px;max-width:96vw;max-height:92vh;overflow-y:auto;padding:24px 26px;box-shadow:0 10px 48px rgba(0,0,0,.22)}
.modal h2{margin:0 0 18px;font-size:17px;font-weight:500}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mfull{margin-bottom:10px}
.mfull>label,.mrow>div>label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.modal input[type=text],.modal input[type=date],.modal input[type=file],.modal select,.modal textarea{width:100%;padding:0 10px;border:.5px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;box-sizing:border-box}
.modal input[type=text],.modal input[type=date],.modal select{height:34px}
.modal input[type=file]{height:34px;padding:6px 10px}
.modal textarea{height:78px;padding:8px 10px;resize:vertical;line-height:1.5}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;box-shadow:0 0 0 2px var(--accent-soft);border-color:var(--accent)}
.modal-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:.5px solid var(--border)}
.modal-footer-right{display:flex;gap:8px}
.btn{height:32px;padding:0 14px;border-radius:var(--radius);font-family:inherit;font-size:13px;cursor:pointer;border:.5px solid var(--border);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:var(--surface);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2)}
.ai-bar{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.ai-status{font-size:12px;color:var(--muted);min-height:18px}
.ai-status.ok{color:var(--teal-text)}
.ai-status.err{color:var(--pink-text)}
.local-badge{background:var(--warn-soft);color:var(--warn-text)}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.hidden{display:none!important}
.spinner{width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.del-btn{font-size:11px;padding:2px 7px;border:.5px solid var(--border);background:var(--surface);border-radius:var(--radius);cursor:pointer;color:var(--muted)}
.del-btn:hover{background:var(--pink-soft);color:var(--pink-text);border-color:transparent}
</style>
</head>

{"t":"Auto enrolment","f":"Auto enrolment v1.0.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Auto%20enrolment%20v1.0.docx","s":"As the owners of this process the Pensions team should contact us about testing and implementing this process at the appropriate time. However, it is usually the case that we contact them. This is a legislative requirement that is carried out every three years.","src":"Change Management","tp":"General Change Management","sy":"PeopleXD","e":"docx","m":"2022-05-06","kb":94.4,"n":0},
{"t":"Bank Sort Codes","f":"Bank Sort Codes Knowledge Article_V0.6.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Bank%20Sort%20Codes%20Knowledge%20Article_V0.6.docx","s":"The list of UK bank sort codes is periodically updated by external companies, and we must incorporate these updates into our list of sort codes within CoreHR’s reference library. We periodically receive a link to the updated list of UK sort codes in an email from helpdesk@mailservice.sortingcodeselectronic.co.uk. This email is sent to InternalServices@it.ox.ac.uk; it is then logged as an Incident in HEAT and assigned to the HRIS Analysis team for processing.","src":"Change Management","tp":"General Change Management","sy":"PeopleXD","e":"docx","m":"2022-11-04","kb":524.2,"n":0},

{"t":"Payroll_Control Report","f":"Payroll_Control Report_ Knowledge Article_V0.1.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Payroll_Control%20Report_%20Knowledge%20Article_V0.1.docx","s":"Payroll Dashboard: Payroll Checking Control Reports The payroll checking control reports are generated and used purely by the payroll team so any queries or requests would only be made via that route. The payroll team may utilise the information from the control reports to provide information to departments such as exceptions, but the control reports would not be available directly to departmental users of PeopleXD. Payroll are responsible for running the validation and...","src":"Change Management","tp":"General Change Management","sy":"PeopleXD","e":"docx","m":"2022-10-19","kb":29.5,"n":0},
{"t":"Portal Configuration","f":"Portal Configuration Knowledge Article version 4.0.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Portal%20Configuration%20Knowledge%20Article%20version%204.0.docx","s":"A request for change could come from any source and are most likely to be a business requirement due to changes in existing process or implementation of new processes. Any changes to any area of the Portal must follow the Change Management process in force at the time of the change. Changes may need to be presented at HRSEG for agreement before being implemented and possibly shared with the relevant POG.","src":"Change Management","tp":"General Change Management","sy":"PeopleXD","e":"docx","m":"2021-11-10","kb":38.6,"n":0},

{"t":"Continuous Service","f":"Continuous Service Knowledge Article_v2.0.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Continuous%20Service%20Knowledge%20Article_v2.0.docx","s":"PeopleXD|People Management: Continuous Service PeopleXD holds rules which determine whether or not a given appointment is eligible to be counted towards an employee’s Continuous Service. Those rules must be aligned with the University’s policy around Continuous Service and should be updated whenever this policy changes or any aspect used within the configuration is added to. The configuration has been set up so that there shouldn’t need to be any reconfiguration required...","src":"Change Management","tp":"Payroll & Pension","sy":"PeopleXD","e":"docx","m":"2023-04-05","kb":114.6,"n":0},
{"t":"Funding Source","f":"Funding Source Knowledge Article.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Funding%20Source%20Knowledge%20Article.docx","s":"HRSEG should be advised about the addition of data into this field, specifically HR Analystics and Reward Teams. The field is currently being used to capture sources of funding in line with the 2020 recruitment protocol so any changes must be made in line with this protocol while it is in place.","src":"Change Management","tp":"Payroll & Pension","sy":"PeopleXD","e":"docx","m":"2020-06-02","kb":41.9,"n":0},
{"t":"Grade and Rates","f":"Grade and Rates Knowledge Article_v1.1.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Grade%20and%20Rates%20Knowledge%20Article_v1.1.docx","s":"Grades and Rates Knowledge Article The Reward Team and HR Analytics Team are responsible for producing and confirming the rates for existing grades. Requests for the creation of any new grades should be raised through these teams, or via the HRSEG on which these teams are represented. To set up a new grade, the following items must be confirmed by the Reward and HR Analytics Teams: Grade Code (e.g.","src":"Change Management","tp":"Payroll & Pension","sy":"PeopleXD","e":"docx","m":"2025-07-21","kb":103.4,"n":0},
{"t":"Pay Code Access Groups","f":"Pay Code Access Groups v0.1.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Pay%20Code%20Access%20Groups%20v0.1.docx","s":"A request for change could come from any source and is most likely to be a business requirement due to changes in existing process or implementation of new processes. Alternatively it could be a fix or enhancement that has been provided by the supplier. Any changes to any area of the Portal must follow the Change Management process in force at the time of the change.","src":"Change Management","tp":"Payroll & Pension","sy":"WFM","e":"docx","m":"2022-08-09","kb":46.4,"n":0},
{"t":"Pay Codes (Allowances Deductions)","f":"Pay Codes (Allowances  Deductions) Knowledge Article_V1.8.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Pay%20Codes%20%28Allowances%20%20Deductions%29%20Knowledge%20Article_V1.8.docx","s":"(Allowances/Deductions) The Payroll Team are responsible for raising a request for a new pay code or changes to an existing pay code. The Reward Team are also important in deciding which allowances we pay and record within the system and are responsible for informing the Payroll team and HR Systems (usually through HRSEG) of any changes to allowances/rates etc. The Payroll Team have a new pay code request template which must be used to record details of the pay code.","src":"Change Management","tp":"Payroll & Pension","sy":"PeopleXD","e":"docx","m":"2025-07-21","kb":211.2,"n":0},
{"t":"Payroll Officer Calculations","f":"Payroll Officer Calculations Knowledge Article_v2.0.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Payroll%20Officer%20Calculations%20Knowledge%20Article_v2.0.docx","s":"The Payroll team is responsible for informing the HR Functional Analysis team of any changes to the Payroll Officer calculations used across the catalogue of reports. A member of Payroll (normally the Payroll Systems Administrator, Tracy Roberts) will raise an incident with the HRIS Support Centre detailing the changes to be made to the different calculation variants (New Starter, Leaver, Pay Audit, and Casual Worker). HR Functional Analysis will then raise a change...","src":"Change Management","tp":"Payroll & Pension","sy":"PeopleXD","e":"docx","m":"2022-08-31","kb":30.0,"n":0},
{"t":"Pension Scheme","f":"Pension Scheme Knowledge Article_V1.4.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Pension%20Scheme%20Knowledge%20Article_V1.4.docx","s":"New Pension Schemes The Payroll and Pensions teams are responsible for requesting the creation of new pension schemes. Pensions should discuss the requirements for the new pension scheme with Payroll. Payroll must then complete a Pension Scheme Template spreadsheet and send it through to the HRIS Support Centre, together with details of any new or amended pay codes which are required to support the new scheme.","src":"Change Management","tp":"Payroll & Pension","sy":"PeopleXD","e":"docx","m":"2023-12-06","kb":58.1,"n":0},
{"t":"Pension Scheme","f":"Pension Scheme Knowledge Article_V1.6.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Pension%20Scheme%20Knowledge%20Article_V1.6.docx","s":"New Pension Schemes The Payroll and Pensions teams are responsible for requesting the creation of new pension schemes. Pensions should discuss the requirements for the new pension scheme with Payroll. Payroll must then complete a Pension Scheme Template spreadsheet and send it through to the HRIS Support Centre, together with details of any new or amended pay codes which are required to support the new scheme.","src":"Change Management","tp":"Payroll & Pension","sy":"PeopleXD","e":"docx","m":"2024-04-09","kb":58.7,"n":0},
{"t":"Diversity and Disability","f":"Diversity and Disability Knowledge Article.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Diversity%20and%20Disability%20Knowledge%20Article.docx","s":"The requirement for changing this data may be as a result of requirements for the HESA return or other legislative changes relating to any element of the Diversity or Disability data. EDU effectively ‘own’ the diversity and disability data. Any proposed changes that have not come from the EDU team must be confirmed with them in advance of the changes being made.","src":"Change Management","tp":"People Management","sy":"PeopleXD","e":"docx","m":"2023-07-14","kb":49.9,"n":0},
{"t":"Employee Self Service Article","f":"Employee Self Service Article v0.2.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Employee%20Self%20Service%20Article%20v0.2.docx","s":"Core Portal|Employee Self Service Approved process for raising - TBC A request for change is likely to be the result of a Business Change Process or possibly a technical fix. Consultation & Approval - TBC There are a number of groups who may need to approve changes to the ESS and/or MSS portal before they are made. As a guide approval should be sought from the following as applicable: HR Policy team about Contract Details and what Managers have access to, Equality and...","src":"Change Management","tp":"People Management","sy":"PeopleXD","e":"docx","m":"2023-04-04","kb":342.9,"n":1},
{"t":"Employee Status","f":"Employee Status Knowledge Article.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Employee%20Status%20Knowledge%20Article.docx","s":"Auto-summary unavailable. See source for details.","src":"Change Management","tp":"People Management","sy":"PeopleXD","e":"docx","m":"2021-10-26","kb":40.8,"n":0},
{"t":"Job Titles","f":"Job Titles Knowledge Article_V0.2.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Job%20Titles%20Knowledge%20Article_V0.2.docx","s":"Requests for Job Titles or Post Titles can be made by any user of Core or consumer of its information. It should ideally be requested with the following information although my not be dependent upon the individual raising: Job Title Description (mandatory) Job Title Code (max 6 chars – alpha numeric) Is the Job Title to be active on Staff Requests? Is the job title to be used for casuals or non-employees?","src":"Change Management","tp":"People Management","sy":"PeopleXD","e":"docx","m":"2020-02-12","kb":29.9,"n":0},
{"t":"Leaving Reason and Location after Leaving","f":"Leaving Reason and Location after Leaving Knowledge Article_V0.2.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/Change%20Management/Leaving%20Reason%20and%20Location%20after%20Leaving%20Knowledge%20Article_V0.2.docx","s":"Changes should be requested by the HRIS Analysis team and authorised via a change request in OSM following the approved change request process. Requests may need to be taken to HRSEG. However, as the data is used for HESA reporting if a change has not been requested by the HR Analytics team they must be consulted before any changes are made.","src":"Change Management","tp":"People Management","sy":"PeopleXD","e":"docx","m":"2021-09-01","kb":38.0,"n":0},

{"t":"DRAFT_HOW TO - Manage Reports - Report Files","f":"DRAFT_HOW TO - Manage Reports - Report Files.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/How%20To%20Guides/REPORTING/DRAFT_HOW%20TO%20-%20Manage%20Reports%20-%20Report%20Files.docx","s":"Report files (.RDLs) The Reports folder Go to the Solution Explorer pane and expand the Reports folder. You will be presented with a list of the report files currently available to open within the solution. If you want to view an existing .RDL file but do not see it displayed in the Solution Explorer, you can add it into the Solution Explorer by going to the Reports folder and right-clicking it.","src":"How To Guides","tp":"Reporting","sy":"PeopleXD","e":"docx","m":"2022-09-02","kb":1167.1,"n":8},
{"t":"Manage Reports - Access Permissions within HR Reporting","f":"HOW TO - Manage Reports - Access Permissions within HR Reporting.docx","p":"https://unioxfordnexus.sharepoint.com/sites/HumanResources-FATeam/Shared%20Documents/HR%20Knowledge%20Base/How%20To%20Guides/REPORTING/HOW%20TO%20-%20Manage%20Reports%20-%20Access%20Permissions%20within%20HR%20Reporting.docx","s":"The SSRS reports developed by the Functional Analysis and HR Analytics teams are stored in the various HR Reporting environments (DEV, TEST, QA and LIVE), where end-users may execute them as necessary. Two levels of security apply to every report: PeopleXD’s database security and HR Reporting’s “folder-based” security. This how-to guide only addresses how to manage security within the HR Reporting environments.","src":"How To Guides","tp":"Reporting","sy":"PeopleXD","e":"docx","m":"2022-05-06","kb":1006.0,"n":6},

<!-- Add Document Modal -->
<div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <h2>Add Document to Knowledge Base</h2>
    <div class="mfull">
      <label>Upload file <span style="color:var(--hint)">(optional &mdash; reads filename &amp; size)</span></label>
      <input type="file" id="up-file" accept=".docx,.pdf,.xlsx,.dotx,.pptx,.lnk">
    </div>
    <div class="mfull">
      <label>Document title *</label>
      <input type="text" id="up-title" placeholder="e.g. HOW TO &ndash; Configure Pay Codes v2.0">
    </div>
    <div class="mfull">
      <label>SharePoint URL *</label>
      <input type="text" id="up-url" placeholder="https://unioxfordnexus.sharepoint.com/...">
    </div>
    <div class="mrow">
      <div>
        <label>Source *</label>
        <select id="up-src">
          <option value="How To Guides">How To Guides</option>
          <option value="Change Management">Change Management</option>
        </select>
      </div>
      <div>
        <label>Topic</label>
        <select id="up-tp">
          <option value="">&#8212; AI will suggest &#8212;</option>
          <option>Core PeopleXD / CoreHR Guides</option>
          <option>Employee &amp; Manager Self Service</option>
          <option>GDPR Request Centre</option>
          <option>General / Root-level</option>
          <option>General Change Management</option>
          <option>Letter &amp; Email Templates</option>
          <option>Payroll &amp; Pension</option>
          <option>People Management</option>
          <option>Recruitment &amp; Applicant</option>
          <option>Reporting</option>
          <option>System Administration</option>
          <option>Templates &amp; Reference</option>
          <option>Time Management / WFM</option>
          <option>Workforce Management (WFM)</option>
        </select>
      </div>
    </div>
    <div class="mrow">
      <div>
        <label>System</label>
        <input type="text" id="up-sy" placeholder="AI will suggest (e.g. PeopleXD, WFM)">
      </div>
      <div>
        <label>Modified date</label>
        <input type="date" id="up-date">
      </div>
    </div>
    <div class="mfull">
      <label>Excerpt / description <span style="color:var(--hint)">(optional &mdash; paste a snippet or describe the doc)</span></label>
      <textarea id="up-excerpt" placeholder="Paste a few sentences from the document, or describe what it covers..."></textarea>
    </div>
    <div class="ai-bar">
      <button class="btn btn-ghost" id="up-ai-btn" type="button">&#10022; Analyse with AI</button>
      <span class="ai-status" id="up-ai-status"></span>
    </div>
    <div class="mfull" style="margin-top:8px">
      <label>Summary <span style="color:var(--hint)">(auto-generated or write your own)</span></label>
      <textarea id="up-summary" placeholder="A concise description of what this document covers..."></textarea>
    </div>
    <div class="modal-footer">
      <div style="font-size:12px;color:var(--muted)">* required</div>
      <div class="modal-footer-right">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-save">Save to Knowledge Base</button>
      </div>
    </div>
  </div>
</div>

<script>
const BASE_DATA = JSON.parse(document.getElementById('kb-data').textContent);
const LOCAL_KEY = 'hrKbAdditions_v1';
function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');}catch{return[];}}
function saveLocal(arr){localStorage.setItem(LOCAL_KEY,JSON.stringify(arr));}
var LOCAL_DATA=loadLocal();
var D=BASE_DATA.concat(LOCAL_DATA.map(function(x){return Object.assign({},x,{_local:true});}));
const Q = s => document.querySelector(s);
var state = { q:'', src:'all', tp:'all', arc:false, sort:'m-desc' };
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(s,q){s=esc(s);if(!q)return s;const t=q.trim().split(/\s+/).filter(Boolean).map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));if(!t.length)return s;return s.replace(new RegExp('('+t.join('|')+')','ig'),'<mark>$1</mark>');}
function filt(){
  const q=state.q.trim().toLowerCase(), tk=q?q.split(/\s+/).filter(Boolean):[];
  let r=D.filter(x=>{
    if(state.src!=='all'&&x.src!==state.src)return false;
    if(state.tp!=='all'&&x.tp!==state.tp)return false;
    if(!state.arc&&/\(Archive\)$/i.test(x.tp))return false;
    if(tk.length){const b=(x.t+' '+x.s+' '+x.f+' '+x.sy).toLowerCase();for(const t of tk)if(!b.includes(t))return false;}
    return true;
  });
  const c={'m-desc':(a,b)=>(b.m||'').localeCompare(a.m||''),'m-asc':(a,b)=>(a.m||'').localeCompare(b.m||''),'t-asc':(a,b)=>a.t.localeCompare(b.t,'en',{sensitivity:'base'}),'st':(a,b)=>a.src.localeCompare(b.src)||a.tp.localeCompare(b.tp)||a.t.localeCompare(b.t)}[state.sort];
  return r.sort(c);
}
function render(){
  const r=filt();
  Q('#meta').textContent=r.length+' of '+D.length+' documents'+(LOCAL_DATA.length?' (+'+LOCAL_DATA.length+' local)':"");
  const c=Q('#out');
  if(!r.length){c.innerHTML='<div class="empty">No matching documents. Try clearing filters or broadening the search.</div>';return;}
  const q=state.q;
  c.innerHTML=r.map(x=>{
    const sc=x.src==='How To Guides'?'b-htg':'b-cm';
    const arc=/\(Archive\)$/i.test(x.tp);
    return `<div class="card">
      <h3>${hl(x.t,q)}</h3>
      <div class="badges">
        <span class="badge ${sc}">${esc(x.src)}</span>
        <span class="badge b-tp">${esc(x.tp)}</span>
        <span class="badge b-sy">${esc(x.sy)}</span>
        <span class="badge b-ext">.${esc(x.e)}</span>
        ${arc?'<span class="badge b-arc">Archive</span>':''}
        ${x._local?'<span class="badge local-badge">&#128206; Local</span> <button class="del-btn" data-del="'+x.f+'">Remove</button>':''}
      </div>
      <div class="summary">${hl(x.s,q)}</div>
      <div class="path-row">
        <span class="path">${esc(x.p)}</span>
        <button class="mini" data-copy="${esc(x.p)}">Copy link</button>
        <a class="mini" style="text-decoration:none;color:inherit;display:inline-block;padding:3px 9px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface);" href="${esc(x.p)}" target="_blank" rel="noopener">Open in SharePoint</a>
      </div>
      <div class="meta">Modified ${esc(x.m)}  ·  ${x.kb} KB  ·  ${esc(x.f)}${x.n?'  ·  '+x.n+' key step'+(x.n===1?'':'s'):''}</div>
    </div>`;
  }).join('');
}
Q('#q').addEventListener('input',e=>{state.q=e.target.value;render();});
Q('#src').addEventListener('change',e=>{state.src=e.target.value;render();});
Q('#tp').addEventListener('change',e=>{state.tp=e.target.value;render();});
Q('#sort').addEventListener('change',e=>{state.sort=e.target.value;render();});
Q('#arc').addEventListener('change',e=>{state.arc=e.target.checked;render();});
// ── Dynamic filter dropdowns ─────────────────────────────────────────────────
function rebuildFilters(){
  const srcs=[...new Set(D.map(x=>x.src))].sort();
  const tps=[...new Set(D.map(x=>x.tp))].sort();
  const srcEl=Q('#src'), tpEl=Q('#tp');
  const curSrc=srcEl.value, curTp=tpEl.value;
  srcEl.innerHTML='<option value="all">All sources</option>'+srcs.map(s=>'<option'+(s===curSrc?' selected':'')+'>'+s+'</option>').join('');
  tpEl.innerHTML='<option value="all">All topics</option>'+tps.map(t=>'<option'+(t===curTp?' selected':'')+'>'+t+'</option>').join('');
}

// ── Export HTML for GitHub ───────────────────────────────────────────────────
Q('#dl-btn').addEventListener('click',function(){
  const combined=BASE_DATA.concat(LOCAL_DATA);
  let src=document.documentElement.outerHTML;
  src=src.replace(/(<script id="kb-data"[^>]*>)([\s\S]*?)(<\/script>)/,
    function(_,a,__,c){return a+JSON.stringify(combined)+c;});
  src=src.replace(/\d+ documents · auto-refreshed/,combined.length+' documents · auto-refreshed');
  const blob=new Blob([src],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=Object.assign(document.createElement('a'),{href:url,download:'index.html'});
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
  Q('#dl-btn').textContent='✓ Downloaded';
  setTimeout(function(){Q('#dl-btn').textContent='⬇ Export HTML';},2500);
});

// ── Click delegation (copy link + delete local) ──────────────────────────────
document.addEventListener('click',function(e){
  if(e.target&&e.target.matches('button.mini[data-copy]')){
    const p=e.target.getAttribute('data-copy');
    navigator.clipboard.writeText(p).then(function(){
      e.target.textContent='Copied';
      setTimeout(function(){e.target.textContent='Copy link';},1200);
    });
  }
  if(e.target&&e.target.matches('.del-btn[data-del]')){
    const fn=e.target.getAttribute('data-del');
    if(!confirm('Remove "'+fn+'" from local additions?'))return;
    LOCAL_DATA=LOCAL_DATA.filter(function(x){return x.f!==fn;});
    saveLocal(LOCAL_DATA);
    D=BASE_DATA.concat(LOCAL_DATA.map(function(x){return Object.assign({},x,{_local:true});}));
    rebuildFilters(); render();
  }
});

// ── Modal ────────────────────────────────────────────────────────────────────
var modal=Q('#modal');

function openModal(){
  Q('#up-date').value=new Date().toISOString().slice(0,10);
  Q('#up-file').value='';
  Q('#up-title').value='';
  Q('#up-url').value='';
  Q('#up-tp').value='';
  Q('#up-sy').value='';
  Q('#up-excerpt').value='';
  Q('#up-summary').value='';
  Q('#up-ai-status').textContent='';
  Q('#up-ai-status').className='ai-status';
  modal.classList.remove('hidden');
  setTimeout(function(){Q('#up-title').focus();},50);
}

function closeModal(){modal.classList.add('hidden');}

Q('#add-btn').addEventListener('click',openModal);
Q('#modal-cancel').addEventListener('click',closeModal);
modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

Q('#up-file').addEventListener('change',function(e){
  var f=e.target.files[0];
  if(!f)return;
  if(!Q('#up-title').value){
    var base=f.name.replace(/\.[^.]+$/,'').replace(/[_-]/g,' ');
    Q('#up-title').value=base;
  }
});

// ── AI Analyse ───────────────────────────────────────────────────────────────
Q('#up-ai-btn').addEventListener('click',async function(){
  var title=Q('#up-title').value.trim();
  var fileObj=Q('#up-file').files[0];
  var filename=fileObj?fileObj.name:title;
  var excerpt=Q('#up-excerpt').value.trim();
  var src=Q('#up-src').value;
  var statusEl=Q('#up-ai-status');

  if(!title&&!filename){
    statusEl.className='ai-status err';
    statusEl.textContent='Enter a title or upload a file first.';
    return;
  }

  statusEl.className='ai-status';
  statusEl.innerHTML='<span class="spinner"></span> Analysing\u2026';
  Q('#up-ai-btn').disabled=true;

  var topicList=['Core PeopleXD / CoreHR Guides','Employee & Manager Self Service','GDPR Request Centre',
    'General / Root-level','General Change Management','Letter & Email Templates','Payroll & Pension',
    'People Management','Recruitment & Applicant','Reporting','System Administration',
    'Templates & Reference','Time Management / WFM','Workforce Management (WFM)'];
  var systemList=['PeopleXD','WFM','Power BI / Reporting','HESA','Infrastructure / Access','General HR'];

  var excerptPart=excerpt?('Content excerpt:\n"""\n'+excerpt.slice(0,1200)+'\n"""'):'';
  var prompt='You are a metadata assistant for an HR Systems knowledge base at the University of Oxford (PeopleXD / CoreHR system).\n\n'
    +'Filename: "'+filename+'"\nSource folder: "'+src+'"\n'+excerptPart+'\n\n'
    +'Generate:\n'
    +'1. summary: A factual 1-3 sentence description of what this document covers. Start with the topic, not "This document".\n'
    +'2. topic: Choose the single most appropriate topic from this exact list: '+JSON.stringify(topicList)+'\n'
    +'3. system: Comma-separated list of relevant systems from: '+JSON.stringify(systemList)+'\n\n'
    +'Return ONLY valid JSON (no markdown, no backticks): {"summary":"...","topic":"...","system":"..."}';

  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:400,
        messages:[{role:'user',content:prompt}]
      })
    });
    var data=await res.json();
    var raw=(data.content&&data.content[0]&&data.content[0].text)||'';
    var cleaned=raw.replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(cleaned);
    if(parsed.summary) Q('#up-summary').value=parsed.summary;
    if(parsed.topic){
      var tpSel=Q('#up-tp');
      var opt=Array.from(tpSel.options).find(function(o){return o.value===parsed.topic;});
      if(opt) tpSel.value=parsed.topic;
    }
    if(parsed.system) Q('#up-sy').value=parsed.system;
    statusEl.className='ai-status ok';
    statusEl.textContent='\u2713 AI analysis complete \u2014 edit any field before saving.';
  }catch(err){
    statusEl.className='ai-status err';
    statusEl.textContent='\u26a0 AI error: '+err.message+'. Fill fields manually.';
  }finally{
    Q('#up-ai-btn').disabled=false;
  }
});

// ── Save document ─────────────────────────────────────────────────────────────
Q('#modal-save').addEventListener('click',function(){
  var title=Q('#up-title').value.trim();
  var url=Q('#up-url').value.trim();
  var src=Q('#up-src').value;
  var tp=Q('#up-tp').value||'General / Root-level';
  var sy=Q('#up-sy').value.trim()||'PeopleXD';
  var summary=Q('#up-summary').value.trim();
  var dateVal=Q('#up-date').value||new Date().toISOString().slice(0,10);
  var file=Q('#up-file').files[0];

  if(!title){alert('Please enter a document title.');Q('#up-title').focus();return;}
  if(!url){alert('Please enter the SharePoint URL.');Q('#up-url').focus();return;}

  var fname=file?file.name:(title.replace(/[^a-zA-Z0-9 _\-.]/g,'_')+'.docx');
  var ext=fname.split('.').pop().toLowerCase();
  var kb=file?+(file.size/1024).toFixed(1):0;

  var entry={t:title,f:fname,p:url,s:summary||'No summary provided.',src:src,tp:tp,sy:sy,e:ext,m:dateVal,kb:kb,n:0};
  LOCAL_DATA.push(entry);
  saveLocal(LOCAL_DATA);
  D=BASE_DATA.concat(LOCAL_DATA.map(function(x){return Object.assign({},x,{_local:true});}));
  rebuildFilters(); render(); closeModal();
});

rebuildFilters();
render();
</script>
</body>
</html>
